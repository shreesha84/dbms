{% extends 'base.html' %}{% block body %}<h1>BLO dashboard — {{ user.username }}</h1><h2>Assigned voters</h2><table class="table"><tr><th>EPIC</th><th>Name</th><th>Section</th><th>Status</th></tr>{% for v in rows %}<tr><td>{{ v.epic }}</td><td>{{ v.name }}</td><td>{{ v.section_no }}</td><td>{{ v.status }}</td></tr>{% endfor %}</table><h2>Verification requests</h2>{% for r in requests %}<form method="post" action="/blo/verification/{{ r.request_id }}" class="card card-body gap-2 mb-2"><b>{{ r.epic }}</b><select name="verified" class="form-select"><option value="true">Verified</option><option value="false">Rejected</option></select><textarea name="field_report" class="form-control" required></textarea><button class="btn btn-primary">Submit report</button></form>{% endfor %}<form method="post" action="/logout"><button class="btn btn-link">Sign out</button></form>{% endblock %}
