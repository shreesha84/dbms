services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sir
      POSTGRES_USER: sir
      POSTGRES_PASSWORD: sir
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sir -d sir"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://sir:sir@db:5432/sir
      SESSION_SECRET: change-me-in-production
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
