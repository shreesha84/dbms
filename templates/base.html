<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>{{ title or 'SIR Management System' }}</title>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">SIR Management System</a>
      {% if user %}
        <div class="d-flex align-items-center gap-3 text-white">
          <span class="small">{{ user.username }} ({{ user.role }})</span>
          <form method="post" action="/logout" class="m-0">
            <button class="btn btn-sm btn-outline-light">Sign out</button>
          </form>
        </div>
      {% endif %}
    </div>
  </nav>
  <main class="container pb-5">
    {% if flash %}
      <div class="alert alert-{{ flash.category }}" role="alert">{{ flash.text }}</div>
    {% endif %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
