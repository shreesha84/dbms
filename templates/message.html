{% extends 'base.html' %}
{% block body %}
<div class="card shadow-sm" style="max-width: 42rem;">
  <div class="card-body">
    <h1 class="h4 mb-3">{{ title }}</h1>
    <div class="alert alert-{{ category or 'info' }}">{{ message }}</div>
    <a class="btn btn-primary" href="{{ back_url or '/dashboard' }}">{{ back_label or 'Back to dashboard' }}</a>
  </div>
</div>
{% endblock %}
