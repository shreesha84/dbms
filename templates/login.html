{% extends 'base.html' %}{% block body %}<h1>SIR Management System</h1><form method="post" action="/login" class="card card-body gap-3" style="max-width:28rem"><label>Username<input name="username" class="form-control" required></label><label>Password<input name="password" type="password" class="form-control" required></label><button class="btn btn-primary">Sign in</button></form><h2 class="mt-4">Voter status lookup</h2><form method="get" action="/voter/status" class="card card-body gap-2" style="max-width:28rem"><input name="epic" class="form-control" placeholder="EPIC" required><button class="btn btn-outline-primary">Look up</button></form>{% endblock %}
