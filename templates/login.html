{% extends 'base.html' %}
{% block body %}
<div class="row g-4">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Sign in</h1>
        <form method="post" action="/login" class="d-grid gap-3">
          <div>
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" class="form-control" required>
          </div>
          <div>
            <label class="form-label" for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" required>
          </div>
          <button class="btn btn-primary">Sign in</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h4 mb-3">Voter status lookup</h2>
        <p class="text-muted small">Check verification and electoral-roll status by EPIC number.</p>
        <form method="get" action="/voter/status" class="d-grid gap-3">
          <div>
            <label class="form-label" for="epic">EPIC Number</label>
            <input id="epic" name="epic" class="form-control" placeholder="e.g. DEM0000001" required>
          </div>
          <button class="btn btn-outline-primary">Look up status</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
