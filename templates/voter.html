{% extends 'base.html' %}{% block body %}<h1>Voter dashboard</h1><p>{{ voter.name }} ({{ voter.epic }}) — {{ voter.status }}</p><h2>Enumeration form</h2><form method="post" action="/voter/form" class="card card-body gap-2"><input class="form-control" name="name" placeholder="Name" required><input class="form-control" name="age" type="number" min="18" max="120" placeholder="Age" required><input class="form-control" name="house_no" placeholder="House number"><button class="btn btn-primary">Submit</button></form><h2 class="mt-4">Report migration</h2><form method="post" action="/voter/migration" class="card card-body gap-2"><input class="form-control" name="from_address" placeholder="Current address" required><input class="form-control" name="to_address" placeholder="New address" required><button class="btn btn-secondary">Report migration</button></form><form method="post" action="/logout" class="mt-3"><button class="btn btn-link">Sign out</button></form>{% endblock %}
